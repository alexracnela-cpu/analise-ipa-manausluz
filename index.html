<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Análise IPA – Manaus Luz</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="img/logo-manaus-luz.png">
<script>
// aplica o tema antes de desenhar a página (evita piscar claro→escuro)
(function(){var t=null;try{t=localStorage.getItem('tema')}catch(e){}
if(!t)t=matchMedia('(prefers-color-scheme: dark)').matches?'escuro':'claro';
document.documentElement.dataset.tema=t;})();
</script>
<style>
:root{
  --bg:#eef2f7; --card:#ffffff; --text:#14213d; --muted:#5b6780; --line:#dfe5ee;
  --accent:#404292; --navy:#0a3366; --ok:#1e8a4c; --warn:#c77700; --bad:#c23b31; --bar:#c3cde0;
  --titulo:#0a3366; --card2:rgba(255,255,255,.96); --aba:rgba(255,255,255,.85); --aba-hover:#fff;
  --zebra:#f5f7fb; --hover:#e8ebf7; --th:#0a3366; --sombra:rgba(10,51,102,.10);
  --plano1:#eaf1fb; --plano2:#f6f9fd; --plano-borda:#cfdcef; --plano-tbl:#fff; --plano-zebra:#f7f9fd;
  --alerta-bg:#fff6e8; --alerta-borda:#f3d39b; --alerta-forte:#9a4f00;
  --meta-bg:#eef0fa; --meta-borda:#cdd2ee; --meta-forte:#404292;
  --veu:rgba(0,0,0,0); color-scheme:light;
}
:root[data-tema="escuro"]{
  --bg:#0d1526; --card:#16213a; --text:#e6ebf5; --muted:#9aa7c0; --line:#2a3757;
  --accent:#8f93ff; --navy:#7fb0f0; --ok:#4cc27e; --warn:#f0a63a; --bad:#ff7468; --bar:#3b4a6e;
  --titulo:#e6ebf5; --card2:rgba(22,33,58,.96); --aba:rgba(22,33,58,.85); --aba-hover:#1e2b4a;
  --zebra:#1a2642; --hover:#24335a; --th:#22325a; --sombra:rgba(0,0,0,.35);
  --plano1:#18264a; --plano2:#141f38; --plano-borda:#2c3d66; --plano-tbl:#16213a; --plano-zebra:#1a2642;
  --alerta-bg:#33240f; --alerta-borda:#6b4a1a; --alerta-forte:#f5b766;
  --meta-bg:#1d2148; --meta-borda:#363c80; --meta-forte:#aeb1ff;
  --veu:rgba(8,13,26,.86); color-scheme:dark;
}
.tema{margin-left:auto;align-self:flex-start;flex:none;border:1px solid var(--line);background:var(--aba);color:var(--titulo);
  font:600 13px Inter,system-ui,sans-serif;padding:7px 14px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.tema:hover{border-color:var(--accent);background:var(--aba-hover)}
:root[data-tema="escuro"] .logo{background:#fff;border-radius:12px;padding:6px 10px;filter:none}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;color:var(--text);font:15px/1.6 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  background:linear-gradient(var(--veu),var(--veu)) fixed,var(--bg) url("img/fundo.jpg") center/cover fixed no-repeat;min-height:100vh}
header{padding:28px 16px 86px;position:relative}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px}
header .wrap{padding:0;display:flex;align-items:center;gap:22px}
.logo{height:96px;width:auto;flex:none;filter:drop-shadow(0 1px 0 rgba(255,255,255,.8))}
header h1{margin:0 0 4px;font-size:clamp(20px,3.2vw,28px);font-weight:700;letter-spacing:-.01em;color:var(--titulo)}
header p{margin:0;color:var(--muted);font-size:14px;font-weight:500}
.abas{max-width:1040px;margin:18px auto 0;display:flex;gap:8px;flex-wrap:wrap}
.aba{border:1px solid var(--line);background:var(--aba);color:var(--titulo);font:600 13px Inter,system-ui,sans-serif;
  padding:7px 14px;border-radius:999px;cursor:pointer}
.aba:hover{background:var(--aba-hover);border-color:var(--accent)}
.aba.ativa{background:var(--th);border-color:var(--navy);color:#fff}
.aba .novo{font-size:10px;font-weight:700;background:#404292;color:#fff;border-radius:6px;padding:1px 5px;margin-left:6px}
.aba.ativa .novo{background:#fff;color:#0a3366}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:-60px;position:relative}
.kpi{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--navy);border-radius:12px;padding:16px 18px;box-shadow:0 6px 18px var(--sombra)}
.kpi .l{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:600}
.kpi .v{font-size:30px;font-weight:700;line-height:1.2;margin-top:4px;font-variant-numeric:tabular-nums;color:var(--navy)}
.kpi .s{font-size:13px;color:var(--muted)}
.kpi.ipa{border-top-color:var(--accent)}
.kpi.ipa .v{color:var(--accent)}
.up{color:var(--ok);font-weight:600}.down{color:var(--bad);font-weight:600}
.card{background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:20px 22px;margin-top:16px;box-shadow:0 6px 18px var(--sombra)}
#grafico svg{width:100%;height:auto;display:block}
#conteudo h2{font-size:20px;margin:32px 0 8px;padding-top:20px;border-top:1px solid var(--line);color:var(--navy)}
#conteudo h2:first-child{border-top:0;margin-top:0;padding-top:0}
#conteudo h3{font-size:16px;margin:22px 0 6px;color:var(--accent)}
#conteudo strong{font-weight:600}
.tbl{overflow-x:auto;margin:12px 0}
.secao-plano{margin:32px -8px 8px;padding:20px 22px 12px;border-radius:12px;background:linear-gradient(180deg,var(--plano1),var(--plano2));
  border:1px solid var(--plano-borda);border-left:6px solid var(--navy);box-shadow:0 4px 14px var(--sombra)}
#conteudo .secao-plano h2{border-top:0;margin-top:0;padding-top:0;display:flex;align-items:center;gap:10px}
#conteudo .secao-plano h2::before{content:"";width:12px;height:12px;border-radius:3px;background:var(--accent);flex:none}
.secao-plano table{background:var(--plano-tbl);border-radius:8px;overflow:hidden}
.secao-plano tbody tr:nth-child(even) td{background:var(--plano-zebra)}
.secao-plano td:nth-child(2){font-weight:500}
.secao-plano .num{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;
  background:var(--th);color:#fff;font-weight:700;font-size:12px}
.nota-plano{margin:4px 0 6px;font-size:12.5px;color:var(--muted);font-style:italic}
.destaque{margin:16px 0;padding:14px 18px 14px 18px;border-radius:10px;border:1px solid;border-left-width:5px}
.destaque p{margin:6px 0 0}
.destaque .selo-d{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  padding:2px 9px;border-radius:999px;color:#fff}
.destaque.alerta{background:var(--alerta-bg);border-color:var(--alerta-borda);border-left-color:#d9822b}
.destaque.alerta .selo-d{background:#c96f12}
.destaque.alerta strong{color:var(--alerta-forte)}
.destaque.meta{background:var(--meta-bg);border-color:var(--meta-borda);border-left-color:var(--accent)}
.destaque.meta .selo-d{background:#404292}
.destaque.meta strong{color:var(--meta-forte)}
table{border-collapse:collapse;width:100%;font-size:13.5px;font-variant-numeric:tabular-nums}
th,td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-weight:600;color:#fff;font-size:12.5px;background:var(--th)}
th:first-child{border-top-left-radius:6px}th:last-child{border-top-right-radius:6px}
tbody tr:nth-child(even) td{background:var(--zebra)}
tbody tr:hover td{background:var(--hover)}
footer{color:var(--muted);font-size:13px;padding:24px 16px 40px;text-align:center}
footer a,.card a{color:var(--accent)}
.erro{color:var(--bad)}
@media (max-width:720px){.kpis{grid-template-columns:repeat(2,1fr)}.kpi .v{font-size:24px}.card{padding:16px}
  header .wrap{flex-direction:column;align-items:flex-start;gap:12px}.logo{height:64px}body{background-attachment:scroll}
  .tema{position:absolute;top:20px;right:16px}}
</style>
</head>
<body>
<header><div class="wrap">
  <img class="logo" src="img/logo-manaus-luz.png" alt="Manaus Luz">
  <div>
    <h1 id="titulo">Análise do Indicador de Prazo (Manaus Luz)</h1>
    <p id="sub">Carregando…</p>
  </div>
  <button class="tema" id="tema" type="button" aria-label="Alternar modo escuro"></button>
</div>
<nav class="abas" id="abas" aria-label="Atualizações"></nav>
</header>

<main class="wrap">
  <section class="kpis" id="kpis"></section>
  <section class="card" id="grafico" aria-label="Gráfico do IPA acumulado"></section>
  <article class="card" id="conteudo"></article>
</main>
<footer id="rodape"></footer>

<script>
// conversor simples de markdown (títulos, negrito, itálico, listas, tabelas, parágrafos)
function esc(t){return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function inl(t){
  t=esc(t).replace(/\\([\\`*_{}\[\]()#+\-.!|~>])/g,'$1');
  return t.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/(^|[^*])\*([^*\s][^*]*?)\*/g,'$1<em>$2</em>')
          .replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
}
function celulas(l){return l.trim().replace(/^\|/,'').replace(/\|$/,'').split(/(?<!\\)\|/).map(c=>c.trim());}
function mdParaHtml(md){
  const blocos=md.replace(/\r/g,'').split(/\n{2,}/); let out='';
  for(const b of blocos){
    const t=b.trim(); if(!t||t.startsWith('<!--')) continue;
    const ls=t.split('\n');
    let m;
    if((m=t.match(/^(#{1,6})\s+(.*)$/)) && ls.length===1){ const n=Math.min(Math.max(m[1].length,2),4); out+=`<h${n}>${inl(m[2])}</h${n}>`; continue; }
    if(ls.every(l=>/^\s*\|/.test(l)) && ls.length>=2){
      const head=celulas(ls[0]); const rows=ls.slice(2).map(celulas);
      out+='<table><thead><tr>'+head.map(c=>`<th>${inl(c)}</th>`).join('')+'</tr></thead><tbody>'+
        rows.map(r=>'<tr>'+r.map(c=>`<td>${inl(c)}</td>`).join('')+'</tr>').join('')+'</tbody></table>'; continue;
    }
    if(ls.every(l=>/^\s*[-*]\s+/.test(l))){ out+='<ul>'+ls.map(l=>`<li>${inl(l.replace(/^\s*[-*]\s+/,''))}</li>`).join('')+'</ul>'; continue; }
    if(ls.every(l=>/^\s*\d+\.\s+/.test(l))){ out+='<ol>'+ls.map(l=>`<li>${inl(l.replace(/^\s*\d+\.\s+/,''))}</li>`).join('')+'</ol>'; continue; }
    const corpo=ls.map(inl).join('<br>');
    const dm=t.match(/^\*\*((Alerta|Meta)[^*]*?)\*\*\s*([\s\S]*)$/i);
    if(dm){
      const tipo=/^alerta/i.test(dm[1])?'alerta':'meta';
      const partes=dm[1].replace(/[:.]\s*$/,'').split(/\s+[—–-]\s+/);
      const resto=(partes[1]?`<strong>${inl((x=>x.charAt(0).toUpperCase()+x.slice(1))(partes.slice(1).join(' — ')))}:</strong> `:'')+inl(dm[3].replace(/\n/g,' '));
      out+=`<div class="destaque ${tipo}"><span class="selo-d">${esc(partes[0])}</span><p>${resto}</p></div>`; continue;
    }
    out+=`<p>${corpo}</p>`;
  }
  return out;
}
const fmt = (n, d=0) => Number(n).toLocaleString('pt-BR', {minimumFractionDigits:d, maximumFractionDigits:d});
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();

function grafico(d){
  let cn=0, ca=0;
  const pts = d.dias.map(r => { cn+=r.os; ca+=r.atrasos; return 100*(1-ca/cn); });
  const W=760, H=360, L=40, T=60, h=230, w=670, n=d.dias.length, band=w/n, bw=band*0.62;
  const min=70, y = v => T + h - (Math.max(v,min)-min)/(100-min)*h;
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="IPA acumulado por dia de fechamento" font-family="Inter,sans-serif" font-size="11">`;
  s += `<text x="${L}" y="22" font-size="16" font-weight="600" fill="${css('--text')}">IPA acumulado do mês por dia de fechamento</text>`;
  s += `<text x="${L}" y="42" fill="${css('--muted')}">${fmt(cn)} OS fechadas, ${fmt(ca)} fora do prazo · % acumulado no prazo</text>`;
  [95,90,80,70].forEach(v=>{
    const meta = v>=90;
    s += `<line x1="${L}" x2="${L+w}" y1="${y(v)}" y2="${y(v)}" stroke="${meta?css('--warn'):css('--line')}" ${meta?'stroke-dasharray="4 3"':''}/>`;
    s += `<text x="${L+w+6}" y="${y(v)+4}" font-size="10" fill="${css('--muted')}">${v}%</text>`;
  });
  d.dias.forEach((r,i)=>{
    const x=L+i*band+(band-bw)/2, yy=y(pts[i]), last=i===n-1;
    s += `<rect x="${x}" y="${yy}" width="${bw}" height="${T+h-yy}" rx="3" fill="${last?css('--accent'):css('--bar')}"><title>${r.dia}: IPA acumulado ${fmt(pts[i],2)}% · no dia ${r.os} OS, ${r.atrasos} fora do prazo</title></rect>`;
    s += `<text x="${x+bw/2}" y="${yy-5}" text-anchor="middle" font-size="9.5" fill="${css('--text')}">${fmt(pts[i],2)}</text>`;
    s += `<text x="${x+bw/2}" y="${T+h+16}" text-anchor="middle" fill="${css('--muted')}">${r.dia}</text>`;
  });
  s += `<line x1="${L}" x2="${L+w}" y1="${T+h}" y2="${T+h}" stroke="${css('--muted')}"/>`;
  s += `<text x="${L}" y="${T+h+38}" fill="${css('--muted')}">Dia de fechamento · tracejado: 95% = nota 1,0; 90% = nota 0,8 · eixo começa em 70%</text></svg>`;
  return s;
}

let INDICE=[], ULTIMO=null;
function rotuloTema(){
  const esc = document.documentElement.dataset.tema==='escuro';
  const b = document.getElementById('tema');
  b.textContent = esc ? '☀️ Modo claro' : '🌙 Modo escuro';
  b.setAttribute('aria-pressed', esc);
}
document.getElementById('tema').addEventListener('click', ()=>{
  const novo = document.documentElement.dataset.tema==='escuro' ? 'claro' : 'escuro';
  document.documentElement.dataset.tema = novo;
  try{ localStorage.setItem('tema', novo); }catch(e){}
  rotuloTema();
  if(ULTIMO) document.getElementById('grafico').innerHTML = grafico(ULTIMO);
});
rotuloTema();
const sem = () => '?v=' + Date.now();
// Os dados vêm direto do GitHub (o robô grava lá 4x ao dia), sem republicar o site na Netlify.
// Se o GitHub falhar, usa a cópia publicada junto com o site.
const GH = 'https://raw.githubusercontent.com/alexracnela-cpu/analise-ipa-manausluz/main/';
async function dado(arq, tipo){
  for (const base of [GH, '']) {
    try {
      const r = await fetch(base + arq + sem(), {cache:'no-store'});
      if (r.ok) return tipo==='json' ? r.json() : r.text();
    } catch(e) {}
  }
  throw new Error('não carregou ' + arq);
}
async function abrir(id){
  try{
    const [d, md] = await Promise.all([
      dado(`historico/${id}.json`, 'json'),
      dado(`historico/${id}.md`, 'text')
    ]);
    document.querySelectorAll('.aba').forEach(b=>b.classList.toggle('ativa', b.dataset.id===id));
    document.getElementById('titulo').textContent = d.titulo;
    document.getElementById('sub').textContent = `Fechamentos de ${d.periodo} · atualizado em ${d.atualizado_em}`;
    const ipa = 100*d.no_prazo/d.os_fechadas;
    const delta = d.ipa_anterior!=null ? ipa - d.ipa_anterior : null;
    const dtxt = delta==null ? '' : ` · <span class="${delta>=0?'up':'down'}">${delta>=0?'▲':'▼'} ${fmt(Math.abs(delta),2)} p.p.</span> vs ${d.atualizado_anterior}`;
    document.getElementById('kpis').innerHTML = `
      <div class="kpi ipa"><div class="l">IPA</div><div class="v">${fmt(ipa,2)}%</div><div class="s">nota ${d.nota}${dtxt}</div></div>
      <div class="kpi"><div class="l">OS fechadas</div><div class="v">${fmt(d.os_fechadas)}</div><div class="s">exceto origem Obra</div></div>
      <div class="kpi"><div class="l">No prazo</div><div class="v">${fmt(d.no_prazo)}</div><div class="s">${fmt(ipa,2)}% do total</div></div>
      <div class="kpi"><div class="l">Fora do prazo</div><div class="v">${fmt(d.fora_do_prazo)}</div><div class="s">atrasos no mês</div></div>`;
    ULTIMO = d;
    document.getElementById('grafico').innerHTML = grafico(d);
    const c = document.getElementById('conteudo');
    c.innerHTML = mdParaHtml(md);
    c.querySelectorAll('table').forEach(t=>{const w=document.createElement('div');w.className='tbl';t.parentNode.insertBefore(w,t);w.appendChild(t);});
    // destaque da seção Plano de ação (do título até o próximo título de mesmo nível)
    c.querySelectorAll('h2').forEach(h=>{
      if(!/plano de a[cç][aã]o/i.test(h.textContent)) return;
      const box=document.createElement('section'); box.className='secao-plano';
      h.parentNode.insertBefore(box,h);
      let n=h; while(n && !(n!==h && n.tagName==='H2')){ const prox=n.nextElementSibling; box.appendChild(n); n=prox; }
      box.querySelectorAll('tbody tr').forEach(tr=>{const td=tr.querySelector('td'); if(td && /^\d+$/.test(td.textContent.trim())) td.innerHTML=`<span class="num">${td.textContent.trim()}</span>`;});
      // sobe o plano para logo depois da Meta do resumo executivo (ou para o fim do resumo, se não houver Meta)
      let ancora=c.querySelector('.destaque.meta');
      if(!ancora){
        const res=[...c.querySelectorAll('h2')].find(x=>/resumo executivo/i.test(x.textContent));
        if(res){ let k=res; while(k.nextElementSibling && k.nextElementSibling.tagName!=='H2' && k.nextElementSibling!==box) k=k.nextElementSibling; ancora=k; }
      }
      if(ancora && ancora.compareDocumentPosition(box) & Node.DOCUMENT_POSITION_FOLLOWING){
        ancora.after(box);
        const nota=document.createElement('p'); nota.className='nota-plano'; nota.textContent='Os números das ações estão detalhados nas seções abaixo.';
        if(!/detalhad[oa]s nas se[cç][oõ]es abaixo/i.test(box.textContent)) box.appendChild(nota);
      }
    });
    document.getElementById('rodape').innerHTML = `Fonte: GisWorks (Manaus Luz) · análise completa e histórico no <a href="${d.doc}" target="_blank" rel="noopener">doc do IPA</a>`;
    if(location.hash.slice(1)!==id) history.replaceState(null,'', id===INDICE[0].id ? location.pathname : '#'+id);
  }catch(e){
    document.getElementById('sub').innerHTML = '<span class="erro">Não foi possível carregar esta atualização.</span>';
    console.error(e);
  }
}
async function carregar(){
  try{
    INDICE = await dado('historico/indice.json', 'json');
    document.getElementById('abas').innerHTML = INDICE.map((it,i)=>
      `<button class="aba" data-id="${it.id}">${it.rotulo}${i===0?'<span class="novo">ATUAL</span>':''}</button>`).join('');
    document.querySelectorAll('.aba').forEach(b=>b.addEventListener('click',()=>{abrir(b.dataset.id); window.scrollTo({top:0,behavior:'smooth'});}));
    const h = location.hash.slice(1);
    abrir(INDICE.some(x=>x.id===h) ? h : INDICE[0].id);
  }catch(e){
    document.getElementById('sub').innerHTML = '<span class="erro">Não foi possível carregar os dados.</span>';
    console.error(e);
  }
}
carregar();
</script>
</body>
</html>
