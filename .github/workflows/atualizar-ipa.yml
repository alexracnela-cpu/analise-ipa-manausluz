name: Atualizar IPA

on:
  # Disparado pelo cron-job.org de hora em hora (Manaus), via API (workflow_dispatch).
  # O agendamento interno do GitHub (schedule) foi retirado porque pulava horários.
  workflow_dispatch: {} # também dá para rodar pelo botão "Run workflow"

permissions:
  contents: write

concurrency:
  group: atualizar-ipa
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # "true" quando o Supabase está ligado: aí nada da análise fica público (repo, logs, anexos)
      PROTEGIDO: ${{ secrets.SUPABASE_URL != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0 # histórico completo: o rebase antes do push precisa dele

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: robo/requirements.txt

      - name: Instalar dependências
        run: |
          pip install -r robo/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Baixar relatório do GisWorks
        env:
          GISWORKS_USUARIO: ${{ secrets.GISWORKS_USUARIO }}
          GISWORKS_SENHA: ${{ secrets.GISWORKS_SENHA }}
        run: python robo/baixar_relatorio.py "$RUNNER_TEMP/relatorio.xlsx" "$RUNNER_TEMP/abertas.xlsx"

      - name: Calcular IPA e gerar a análise
        env:
          # Com estes dois secrets, a análise vai para o Supabase (só quem tem login vê)
          # e deixa de ser gravada no repositório público.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET: ${{ secrets.SUPABASE_SECRET }}
        run: |
          if [ "$PROTEGIDO" = "true" ]; then
            # repositório público: os logs ficam visíveis, então não imprime os números
            python robo/atualizar_site.py "$RUNNER_TEMP/relatorio.xlsx" "$RUNNER_TEMP/abertas.xlsx" > "$RUNNER_TEMP/resumo.txt"
            echo "### Análise atualizada e gravada no Supabase" >> "$GITHUB_STEP_SUMMARY"
          else
            python robo/atualizar_site.py "$RUNNER_TEMP/relatorio.xlsx" "$RUNNER_TEMP/abertas.xlsx" | tee "$RUNNER_TEMP/resumo.txt"
            echo "### $(cat "$RUNNER_TEMP/resumo.txt")" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publicar (commit na main; o site lê do GitHub, a Netlify não republica)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        run: |
          if [ -n "$SUPABASE_URL" ]; then echo "Análise gravada no Supabase; nada vai para o repositório público."; exit 0; fi
          git config user.name "robo-ipa"
          git config user.email "robo-ipa@users.noreply.github.com"
          git add historico/ robo/diagnostico.txt 2>/dev/null || git add historico/
          if git diff --cached --quiet; then echo "Nada mudou."; exit 0; fi
          git commit -m "IPA automático $(TZ=America/Manaus date '+%d/%m %Hh%M') [skip netlify]"
          for i in 1 2 3; do
            git fetch origin main && git rebase origin/main && git push origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true
            sleep 10
          done
          echo "::error::Não consegui enviar para a main. Confira em Settings > Actions > General > Workflow permissions se está marcado 'Read and write permissions'."
          exit 1

      - name: Guardar os relatórios baixados (3 dias, só no GitHub; desligado no modo protegido)
        if: always() && env.PROTEGIDO != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-gisworks
          path: |
            ${{ runner.temp }}/relatorio.xlsx
            ${{ runner.temp }}/abertas.xlsx
          retention-days: 3
          if-no-files-found: ignore

      - name: Guardar print do erro
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: erro-gisworks
          path: erro_gisworks.png
          if-no-files-found: ignore
