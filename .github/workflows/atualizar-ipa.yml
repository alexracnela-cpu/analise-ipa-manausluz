name: Atualizar IPA

on:
  schedule:
    # 6h, 8h, 12h e 16h em Manaus (UTC-4) = 10h, 12h, 16h e 20h UTC.
    # Minuto 7 para fugir do pico do GitHub; o GitHub pode atrasar alguns minutos.
    - cron: "7 10,12,16,20 * * *"
  workflow_dispatch: {} # botão "Run workflow" para rodar na hora

permissions:
  contents: write

concurrency:
  group: atualizar-ipa
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: robo/requirements.txt

      - name: Instalar dependências
        run: |
          pip install -r robo/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Baixar relatório do GisWorks
        env:
          GISWORKS_USUARIO: ${{ secrets.GISWORKS_USUARIO }}
          GISWORKS_SENHA: ${{ secrets.GISWORKS_SENHA }}
        run: python robo/baixar_relatorio.py "$RUNNER_TEMP/relatorio.xlsx"

      - name: Calcular IPA e criar a aba
        run: python robo/atualizar_site.py "$RUNNER_TEMP/relatorio.xlsx"

      - name: Publicar (commit na main → Netlify republica)
        run: |
          git config user.name "robo-ipa"
          git config user.email "robo-ipa@users.noreply.github.com"
          git add historico/
          if git diff --cached --quiet; then echo "Nada mudou."; exit 0; fi
          git commit -m "IPA automático $(TZ=America/Manaus date '+%d/%m %Hh%M')"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 10
          done
          exit 1

      - name: Guardar print do erro
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: erro-gisworks
          path: erro_gisworks.png
          if-no-files-found: ignore
